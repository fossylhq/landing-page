<html lang="en">

<meta name="twitter:title" content="fossyl">
<meta name="twitter:description" content="Next-Gen 3D Walkthroughs with Built-In Analytics.">

<style>
  :root{
    --bg:#fefefe; --surface:#fbfbfa; --surface-2:#efefed;
    --ink:#16161a; --ink-2:#54545a; --ink-3:#6b6b71;
    --line:#e2e2df; --line-2:#d4d4d0;
    --accent:#16161a; --on-accent:#fbfbfa;
    --frost-bg:rgba(251,251,250,.55); --frost-border:rgba(22,22,26,.08);
  }

  *,*::before,*::after{box-sizing:border-box; font-weight:400 !important;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Manrope', system-ui, sans-serif;
    transition:background .25s ease, color .25s ease;
    position:relative;
  }
  a{color:inherit; text-decoration:none;}
  #bgCanvas{
    position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;
    -webkit-mask-image:radial-gradient(ellipse 62% 55% at 50% 22%, black 0%, black 35%, transparent 92%);
    mask-image:radial-gradient(ellipse 62% 55% at 50% 22%, black 0%, black 35%, transparent 92%);
  }
  main{position:relative; z-index:1;}
  .frame{max-width:1280px; margin:0 auto; padding-inline:1.25rem;}

  /* ---- header ---- */
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:1.25rem 1.25rem;
    max-width:1280px; margin:0 auto;
  }
  .wordmark{font-size:16px; letter-spacing:-0.01em; color:var(--ink);}

  :focus-visible{outline:none; box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink); border-radius:2px;}

  /* ---- hero ---- */
  .hero{padding:5rem 1.25rem 1.5rem; perspective:1400px;}
  .hero-text{max-width:760px; margin:0 auto; text-align:center;}
  h1.headline{
    font-family:'Instrument Serif', serif;
    font-size:clamp(1.9rem, 5.2vw, 4.6rem);
    line-height:1.02; letter-spacing:-0.02em;
    margin:0 auto 1.5rem; max-width:min(760px,100%);
    color:var(--ink);
  }
  h1.headline .line-wrap{
    display:block;
    overflow:hidden;
  }
  h1.headline .line{
    display:inline-block;
    white-space:normal;
    overflow-wrap:break-word;
    word-break:normal;
    transform:translateY(112%);
    animation:lineUp .85s cubic-bezier(.16,1,.3,1) forwards;
  }
  @media (max-width: 520px){
    h1.headline{
      font-size:clamp(1.5rem, 7vw, 3.2rem);
      line-height:1.05;
    }
  }
  h1.headline .line-wrap:nth-child(1) .line{animation-delay:.35s;}
  h1.headline .line-wrap:nth-child(2) .line{animation-delay:.45s;}
  @keyframes lineUp{to{transform:translateY(0);}}
  .sub{
    font-size:clamp(15px, 1.6vw, 18px);
    line-height:1.55; color:var(--ink-2);
    margin:0 auto 2rem; max-width:560px;
  }
  .cta{
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.85rem 1.5rem; border-radius:4px;
    background:var(--accent); color:var(--on-accent);
    font-size:15px; letter-spacing:-0.005em;
    transition:opacity .2s ease, transform .25s cubic-bezier(.16,1,.3,1);
  }
  .cta:hover{opacity:.86;}
  .cta:active{transform:scale(.98);}

  /* ---- viewfinder / video frame ---- */
  .viewfinder{
    position:relative; margin:0 auto 0; max-width:380px;
    aspect-ratio:16/9; border-radius:4px; overflow:hidden;
    background:transparent; opacity:0;
    transform:translateY(12px) scale(.985);
    transform-style:preserve-3d; will-change:transform;
    transition:opacity .45s ease, transform .45s ease, transform .4s cubic-bezier(.16,1,.3,1);
  }
  .viewfinder.visible{opacity:1; transform:none;}
  .viewfinder video,
  .viewfinder canvas{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; object-fit:cover; object-position:center;
    pointer-events:none;
  }
  .viewfinder video{opacity:0; z-index:0;}
  .viewfinder canvas{background:transparent; z-index:1;}
  .viewfinder::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:.05; mix-blend-mode:overlay;
  }

  /* ---- solution section ---- */
  .solution{padding:1.5rem 1.25rem 5rem;}
  h1.section-heading{
    position:relative;
    font-size:clamp(1.2rem, 3.8vw, 2.4rem);
    letter-spacing:-0.02em; line-height:1.15;
    margin:0 auto 2rem; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    gap:.65rem;
    flex-wrap:nowrap;
    max-width:760px;
    text-align:center;
    width:100%;
  }
  h1.section-heading span{
    display:inline-block;
    max-width:calc(100% - 2.5rem);
    text-align:center;
  }
  h1.section-heading i{
    font-size:1em !important;
    width:auto; height:auto;
    color:var(--ink); line-height:1;
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  @media (max-width:640px){
    h1.section-heading{
      font-size:clamp(1rem, 5vw, 1.8rem);
      gap:.5rem;
      max-width:100%;
    }
    h1.section-heading i{
      font-size:0.95em !important;
    }
    h1.section-heading span{
      max-width:calc(100% - 2rem);
    }
  }
  .player{
    position:relative; margin:0 auto; max-width:920px;
    aspect-ratio:16/9; border-radius:4px; overflow:hidden;
    background:var(--surface-2); border:1px solid var(--line);
    cursor:pointer;
  }
  .player img{width:100%; height:100%; object-fit:cover; display:block; opacity:.9;}
  .player iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:#f7f7f3;}
  @media (max-width:640px){
    .player{aspect-ratio:9/16;}
    .player iframe{
      width:118%; height:118%; left:-9%; top:-9%;
      transform:scale(.85);
      transform-origin:center center;
    }
  }
  .play-btn{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    background:var(--frost-bg); border:1px solid var(--frost-border);
    backdrop-filter:blur(11px) saturate(120%); -webkit-backdrop-filter:blur(11px) saturate(120%);
    color:var(--ink); transition:background .2s ease, transform .2s ease;
  }
  .player:hover .play-btn{transform:translate(-50%,-50%) scale(1.05);}
  .play-btn i{font-size:24px;}
  .player.playing .play-btn,.player.playing img{display:none;}
  .player.playing iframe{display:block;}

  /* ---- motion ---- */
  .fade-up{opacity:0; transform:translateY(14px); animation:fadeUp .5s ease forwards;}
  .fade-up.d1{animation-delay:.25s;}
  .fade-up.d2{animation-delay:.58s;}
  .fade-up.d3{animation-delay:.7s;}
  @keyframes fadeUp{to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .fade-up{opacity:1; transform:none; animation:none;}
    h1.headline .line{transform:none; animation:none;}
    .viewfinder{opacity:1; transform:none; animation:none;}
    .viewfinder video,
    .viewfinder canvas{opacity:1; transition:none;}
    .viewfinder::after{display:none;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<canvas id="bgCanvas" aria-hidden="true"></canvas>

<main class="frame">
  <section class="hero">
    <div class="viewfinder fade-up d1">
      <video id="heroVideo" src="https://framerusercontent.com/assets/y1vy1zFIUQMMpVxzsopyl3zirE.mp4" preload="auto" muted playsinline autoplay crossorigin="anonymous"></video>
      <canvas id="heroVideoCanvas" aria-hidden="true"></canvas>
    </div>

    <div class="hero-text">
      <h1 class="headline">
        <span class="line-wrap"><span class="line">Next-Gen 3D Walkthroughs</span></span>
        <span class="line-wrap"><span class="line">with Built-In Analytics.</span></span>
      </h1>
      <p class="sub fade-up d2">Fossyl turns any physical space into a photorealistic 3D experience, and every visit into sales intelligence your team can act on</p>
      <a class="cta fade-up d3" href="mailto:contact@fossylhq.com">Book a demo</a>
    </div>
  </section>

  <section class="solution">
    <h1 class="section-heading"><span>Watch the real thing in action</span> <i class="ph ph-arrow-down"></i></h1>
    <div class="player" id="ytPlayer">
      <img src="https://file.garden/akqmiOgNuCMnLJoc/embed_thumnail.png" alt="" loading="lazy">
      <button class="play-btn" aria-label="Play video">
        <i class="ph-thin ph-play"></i>
      </button>
    </div>
  </section>
</main>

<script>
  (function(){
    var canvas = document.getElementById('bgCanvas');
    var ctx = canvas.getContext('2d');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var W, H, cssW, cssH;
    var CELL = 17;
    var RAMP = ' .:-=+*#%@';

    var mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999 };

    function resize(){
      cssW = window.innerWidth;
      cssH = window.innerHeight;
      W = canvas.width = cssW * DPR;
      H = canvas.height = cssH * DPR;
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      ctx.font = (CELL * 0.92 * DPR) + 'px "SFMono-Regular", Menlo, Consolas, monospace';
      ctx.textBaseline = 'middle';
    }
    resize();
    window.addEventListener('resize', resize);

    window.addEventListener('mousemove', function(e){
      mouse.tx = e.clientX * DPR;
      mouse.ty = e.clientY * DPR;
    });
    window.addEventListener('mouseleave', function(){
      mouse.tx = -9999; mouse.ty = -9999;
    });

    var t = 0;
    var cell = CELL * DPR;
    var lastBgTime = 0;

    function draw(){
      ctx.clearRect(0, 0, W, H);
      mouse.x += (mouse.tx - mouse.x) * 0.08;
      mouse.y += (mouse.ty - mouse.y) * 0.08;

      var cols = Math.ceil(W / cell) + 1;
      var rows = Math.ceil(H / cell) + 1;
      var ringRadius = 460 * DPR;

      for(var r = 0; r < rows; r++){
        var py = r * cell + cell * 0.5;
        for(var c = 0; c < cols; c++){
          var px = c * cell + cell * 0.5;

          var ambient = 0.24 + 0.14 * Math.sin(px * 0.006 + t * 0.6) * Math.cos(py * 0.008 - t * 0.4);

          var dx = px - mouse.x, dy = py - mouse.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          var falloff = Math.max(0, 1 - d / ringRadius);
          var ring = Math.sin(d * 0.045 - t * 3.2) * 0.5 + 0.5;
          var scan = falloff * falloff * ring * 0.85;

          var v = Math.max(0, Math.min(1, ambient + scan));
          if(v < 0.05) continue;

          var idx = Math.floor(v * (RAMP.length - 1));
          var ch = RAMP.charAt(idx);
          if(ch === ' ') continue;

          ctx.fillStyle = 'rgba(22,22,26,' + (v * 0.7).toFixed(3) + ')';
          ctx.fillText(ch, px, py);
        }
      }

      if(!reduce) t += 0.032;
    }

    function loop(timestamp){
      if(!reduce){
        if(!document.hidden && (!lastBgTime || timestamp - lastBgTime >= 33)){
          draw();
          lastBgTime = timestamp;
        }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
</script>


<script>
  (function(){
    var v = document.getElementById('heroVideo');
    var canvas = document.getElementById('heroVideoCanvas');
    var viewfinder = document.querySelector('.viewfinder');
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var suppressFrame = false;
    var viewfinderReady = false;

    function resizeCanvas(){
      var rect = canvas.getBoundingClientRect();
      if(!rect.width || !rect.height) return;
      var width = Math.round(rect.width * dpr);
      var height = Math.round(rect.height * dpr);
      if(canvas.width !== width || canvas.height !== height){
        canvas.width = width;
        canvas.height = height;
      }
    }

    function renderFrame(){
      if(!v.videoWidth || !v.videoHeight || suppressFrame || v.readyState < 2) return;
      resizeCanvas();
      var rect = canvas.getBoundingClientRect();
      var videoRatio = v.videoWidth / v.videoHeight;
      var targetRatio = rect.width / rect.height;
      var width = canvas.width;
      var height = canvas.height;
      var dx = 0;
      var dy = 0;
      var dw = width;
      var dh = height;

      if(videoRatio > targetRatio){
        dh = Math.round(width / videoRatio);
        dy = Math.round((height - dh) / 2);
      } else {
        dw = Math.round(height * videoRatio);
        dx = Math.round((width - dw) / 2);
      }

      ctx.drawImage(v, 0, 0, v.videoWidth, v.videoHeight, dx, dy, dw, dh);
      if(!viewfinderReady){
        viewfinderReady = true;
        viewfinder.classList.add('visible');
      }

      try {
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var pixels = imageData.data;
        for(var i = 0, x = 0; i < pixels.length; i += 4){
          var r = pixels[i];
          var g = pixels[i + 1];
          var b = pixels[i + 2];
          var maxColor = Math.max(r, g, b);
          var minColor = Math.min(r, g, b);
          var isNearWhite = maxColor > 238 && minColor > 218 && (maxColor - minColor) < 18;
          var isNearBlack = maxColor < 30 && minColor < 30;
          var outsideVideoWidth = x < dx || x >= dx + dw;
          if (isNearWhite || (isNearBlack && outsideVideoWidth)) {
            pixels[i + 3] = 0;
          } else {
            pixels[i + 3] = 255;
          }
          x++;
          if(x === canvas.width){ x = 0; }
        }
        ctx.putImageData(imageData, 0, 0);
      } catch (err) {
        // CORS or access denied; leave video visible without mask
      }
    }

    var lastVideoFrame = 0;
    function animate(timestamp){
      if(!videoAnimating) return;
      if(!document.hidden && (!lastVideoFrame || timestamp - lastVideoFrame >= 40)){
        renderFrame();
        lastVideoFrame = timestamp;
      }
      requestAnimationFrame(animate);
    }

    var videoAnimating = false;
    function startVideoAnimate(){
      if(videoAnimating) return;
      videoAnimating = true;
      requestAnimationFrame(animate);
    }
    function stopVideoAnimate(){
      videoAnimating = false;
    }

    v.loop = true;
    v.addEventListener('loadedmetadata', renderFrame);
    v.addEventListener('play', startVideoAnimate);
    v.addEventListener('pause', stopVideoAnimate);
    window.addEventListener('resize', renderFrame);
    document.addEventListener('visibilitychange', function(){
      if(document.hidden){
        stopVideoAnimate();
      } else if(!v.paused){
        startVideoAnimate();
      }
    });
    v.play().catch(function(){});
  })();

  (function(){
    var player = document.getElementById('ytPlayer');
    player.addEventListener('click', function(){
      if(player.classList.contains('playing')) return;
      var iframe = document.createElement('iframe');
      iframe.src = 'https://lens.fossylhq.com/rd-cr-v.html';
      iframe.title = 'Website Embed';
      iframe.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen';
      iframe.frameBorder = '0';
      player.appendChild(iframe);
      player.classList.add('playing');
    });
  })();
</script>

<script>
  (function(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce) return;

    var vf = document.querySelector('.viewfinder');
    vf.addEventListener('mousemove', function(e){
      var r = vf.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - .5;
      var py = (e.clientY - r.top) / r.height - .5;
      vf.style.transform = 'rotateX(' + (py * -8) + 'deg) rotateY(' + (px * 8) + 'deg) scale(1.02)';
    });
    vf.addEventListener('mouseleave', function(){
      vf.style.transform = 'rotateX(0) rotateY(0) scale(1)';
    });

    var cta = document.querySelector('.cta');
    cta.addEventListener('mousemove', function(e){
      var r = cta.getBoundingClientRect();
      var x = (e.clientX - r.left - r.width / 2) * .3;
      var y = (e.clientY - r.top - r.height / 2) * .3;
      cta.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    });
    cta.addEventListener('mouseleave', function(){
      cta.style.transform = '';
    });
  })();
</script>

</body>
